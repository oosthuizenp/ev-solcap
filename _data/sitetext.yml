faq:
  title: "Home Loan Questions"
  text: "Straight answers to the things people usually want to know before applying for a bond."
  section: home-loan-faq
  list:
    - question: "How does home-loan pre-qualification work?"
      answer: "Pre-qualification gives you a rough idea of what you may be able to borrow based on your income, expenses, and credit profile. It is a helpful starting point before you make an offer on a property."
    - question: "What documents are usually needed for a bond application?"
      answer: "Most banks want your ID, proof of income, recent payslips or tax returns, bank statements, and details of the property you want to buy. If you are self-employed, extra business records may also be required."
    - question: "How long does bond approval take?"
      answer: "The timeline can vary, but many applications move fairly quickly once the documents are complete. Delays usually happen when the bank needs more information or when the property details are still being finalised."
    - question: "Can self-employed applicants qualify for a home loan?"
      answer: "Yes, self-employed applicants can qualify. Lenders usually want more supporting documents, such as business financials and tax records, so the application can be assessed properly."
    - question: "Does making an enquiry guarantee approval?"
      answer: "No. An enquiry is just the start of the process. The lender still needs to assess your documents, affordability, and the details of the property before approving the loan."
    - question: "Is Solomon Capital a lender?"
      answer: "No. Solomon Capital is a bond originator and home-loan adviser. We help you prepare and submit your application to banks and guide you through the process, without acting as the lender yourself."

