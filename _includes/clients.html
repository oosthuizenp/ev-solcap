<section class="bg-light page-section py-1 position-relative" id="clients">
  <div class="container">
    
    <!-- Top Heading -->
    <div class="row">
      <div class="col-12 text-center">
        <h2 class="section-heading">
          {{ site.data.sitetext.clients.title | default: "We work with all the leading banks" }}
        </h2>
        {% assign clients_text = site.data.sitetext.clients.text | default: "" | strip %}
        {% if clients_text.size > 0 %}
        <h3 class="section-subheading text-muted">{{ clients_text }}</h3>
        {% endif %}
      </div>
    </div>

    <!-- Client Logos -->
    <div class="row justify-content-center mt-4 flex-wrap gap-3">
      {% for client in site.data.sitetext.clients.list %}
      <div class="client-logo-card d-flex align-items-center justify-content-center">
        <a href="{{ client.url | default: '#' }}">
          <img class="img-fluid" src="{{ client.logo }}" alt="{{ client.title }}" loading="lazy">
        </a>
      </div>
      {% endfor %}
    </div>

  </div>
</section>
